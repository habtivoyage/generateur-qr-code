name: Compiler l'application Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['projet.zip.b64', '.github/workflows/build-android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet
        run: |
          mkdir app
          base64 -d projet.zip.b64 > projet.zip
          unzip -q projet.zip -d app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Installer les dépendances, polices et icônes
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          mkdir -p www/vendor www/fonts
          cp node_modules/qrcodejs/qrcode.min.js www/vendor/
          cp node_modules/jsbarcode/dist/JsBarcode.all.min.js www/vendor/
          cp node_modules/@fontsource/poppins/files/poppins-latin-{400,500,600,700}-normal.woff2 www/fonts/
          python3 -m pip install --quiet pillow
          python3 scripts/make-icons.py

      - name: Créer le projet Android
        working-directory: app
        run: npx cap add android

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "Aucune clé de signature : seul l'APK de test sera produit."
          fi

      - name: Configurer l'application (icônes, version, signature)
        working-directory: app
        run: |
          node scripts/configure-android.mjs
          npx cap sync android

      - name: Compiler
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          if [ "$SIGNED" = "true" ]; then
            ./gradlew --no-daemon bundleRelease assembleRelease
          fi

      - name: Publier l'APK de test
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk qr-codes-barres-test.apk
          gh release create "v1.0.${{ github.run_number }}" qr-codes-barres-test.apk \
            --title "APK de test 1.0.${{ github.run_number }}" \
            --notes "APK de test à installer sur un téléphone Android."

      - name: AAB pour le Google Play Store
        if: env.SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aab-google-play
          path: app/android/app/build/outputs/bundle/release/app-release.aab

      - name: APK signé
        if: env.SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-signe
          path: app/android/app/build/outputs/apk/release/app-release.apk
